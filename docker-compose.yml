version: '3.8'

services:
  app:
    build: .
    container_name: tektutors-whatsapp-agent
    restart: always
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-tektutors_verify_token_secret}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - WEBHOOK_VERIFY_SIGNATURE_STRICT=${WEBHOOK_VERIFY_SIGNATURE_STRICT:-True}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_secure_pass@db:5432/tektutors
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-tektutorsng@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-tektutorsng@gmail.com}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-TekTutors Academy}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-False}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: tektutors-postgres-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass
      - POSTGRES_DB=tektutors
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tektutors"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
